<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador y Envío de Informes</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div class="form-container">
        <h2>Crear Informe</h2>
        <form id="informeForm">
            <div class="input-group">
                <label for="informeId">ID del Informe</label>
                <input type="text" id="informeId" name="informeId" placeholder="Ej: INF-102" required>
            </div>

            <div class="input-group">
                <label for="titulo">Título del Informe</label>
                <input type="text" id="titulo" name="titulo" placeholder="Resumen mensual de ventas" required>
            </div>

            <div class="input-group">
                <label for="contenido">Contenido</label>
                <textarea id="contenido" name="contenido" rows="5" placeholder="Escribe los detalles aquí..." required></textarea>
            </div>

            <div class="input-group">
                <label for="canal">Canal de Envío</label>
                <select id="canal" name="canal">
                    <option value="discord">Discord (vía Webhook)</option>
                    <option value="email">Correo Electrónico</option>
                </select>
            </div>

            <div class="input-group" id="destinoGroup">
                <label id="destinoLabel" for="destino">URL del Webhook de Discord</label>
                <input type="text" id="destino" name="destino" placeholder="https://discord.com/api/webhooks/..." required>
            </div>

            <button type="submit" id="btnSubmit">Enviar Informe</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
